<!DOCTYPE html>
<html lang="en" style="height: 100%; margin: 0; background: #000; overflow: hidden;">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Really regressing this aspect ratio now -->
    <style>
        #container {
            aspect-ratio: 9 / 16;
            width: min(100vw, calc(100vh * 9 / 16));
            width: min(100vw, calc(100dvh * 9 / 16));
        }

        #container ruffle-player {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body style="height: 100%; margin: 0; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center;">
    <div id="container"></div>
</body>
<script src="./ruffle.js"></script>
<script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
        // Merge with any existing config, such as the user's extension config. Options you set below will have priority.
        ...window.RufflePlayer.config,

        // Options affecting the whole page
        "publicPath": undefined,
        "polyfills": true,

        // Options affecting files only
        "allowScriptAccess": false, // Polyfill elements have a different default value, see the allowScriptAccess section
        "autoplay": "auto",
        "unmuteOverlay": "visible",
        "backgroundColor": null,
        "wmode": "window",
        "letterbox": "on",
        "warnOnUnsupportedContent": true,
        "contextMenu": "on",
        "showSwfDownload": false,
        "upgradeToHttps": false,
        "maxExecutionDuration": 15,
        "logLevel": "info",
        "base": null,
        "menu": true,
        "salign": "",
        "forceAlign": false,
        "scale": "showAll",
        "forceScale": false,
        "frameRate": null,
        "quality": "best",
        "splashScreen": true,
        "preferredRenderer": null,
        "openUrlMode": "allow",
        "allowNetworking": "all",
        "favorFlash": true,
        "playerVersion": 32,
        "socketProxy": [],
        "fontSources": [],
        "defaultFonts": {},
        "credentialAllowList": [],
        "playerRuntime": "flashPlayer",
        "allowFullscreen": true,
        "fullScreenAspectRatio": "",
        "backgroundExecutionMode": "none",
    };
    
    window.addEventListener("load", (event) => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("container");
        container.appendChild(player);
        player.ruffle().load("ld60.swf");
    });
</script>
</html>
